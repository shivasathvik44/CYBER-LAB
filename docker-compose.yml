services:
  # ----------------------------------------------------------------------------
  # Vulnerable Target: OWASP Juice Shop
  # Status: IMPLEMENTED (Ready for local containerized deployment)
  # Bound strictly to 127.0.0.1 to avoid exposing vulnerable services to the LAN.
  # ----------------------------------------------------------------------------
  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    container_name: homelab-juice-shop
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JUICE_SHOP_PORT:-3000}:3000"
    networks:
      homelab-net:
        ipv4_address: 172.20.0.20
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Network IDS: Suricata
  # Status: PLANNED (Configuration template ready, deployment marked TODO)
  # Monitors traffic on the isolated homelab bridge network.
  # ----------------------------------------------------------------------------
  suricata:
    image: jasonish/suricata:6.0.13
    container_name: homelab-suricata
    restart: unless-stopped
    network_mode: "host" # Requires host or promiscuous interface tap
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./deployment/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./deployment/suricata/rules:/var/lib/suricata/rules:ro
      - ./deployment/suricata/logs:/var/log/suricata
    command: -i ${SURICATA_INTERFACE:-lo} -vv
    profiles: ["ids"] # Activated when IDS profile is requested

  # ----------------------------------------------------------------------------
  # SIEM: Wazuh Manager (Single-Host Reference Template)
  # Status: PLANNED (Full multi-container cluster setup documented in docs/LAB-SETUP.md)
  # TODO: Deploy Wazuh indexer + dashboard when dedicated system resources (>= 6GB RAM) are verified.
  # ----------------------------------------------------------------------------
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.0
    container_name: homelab-wazuh-manager
    restart: unless-stopped
    ports:
      - "127.0.0.1:1514:1514/tcp"  # Agent communication
      - "127.0.0.1:1515:1515/tcp"  # Agent enrollment
      - "127.0.0.1:55000:55000/tcp" # Wazuh RESTful API
      - "127.0.0.1:514:514/udp"    # Syslog ingestion
    networks:
      homelab-net:
        ipv4_address: 172.20.0.10
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - ./deployment/wazuh/config/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
    environment:
      - INDEXER_URL=https://172.20.0.11:9200
      - INDEXER_USER=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:-HomelabAdminPass123!}
    profiles: ["wazuh"]

networks:
  homelab-net:
    name: homelab-isolated-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
