name: CI - Automation Tests & Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    name: Test, Validate & Demo (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate Python Syntax
        run: |
          python -m py_compile scripts/*.py tests/*.py

      - name: Validate Shell Script Syntax
        run: |
          bash -n scripts/*.sh scenarios/*/*.sh .devcontainer/setup.sh

      - name: Validate YAML & JSON Configurations
        run: |
          python -c "
          import json, glob, yaml
          yaml.safe_load(open('docker-compose.yml'))
          yaml.safe_load(open('deployment/suricata/suricata.yaml'))
          json.load(open('.devcontainer/devcontainer.json'))
          print('[PASS] YAML and JSON configuration files are syntactically valid.')
          "

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        run: |
          pytest -v tests/

      - name: Run File Integrity Monitoring Demonstration
        run: |
          bash scenarios/02-file-integrity/run_demo.sh

      - name: Run SSH Brute-Force Log Analysis Demonstration
        run: |
          bash scenarios/01-ssh-bruteforce/run_demo.sh

